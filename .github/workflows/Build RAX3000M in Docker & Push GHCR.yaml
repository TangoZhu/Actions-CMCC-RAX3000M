name: Build RAX3000M in Docker & Push GHCR

on:
  workflow_call:
    inputs:
      upstream_tag:
        description: 'The new upstream tag that triggered this run'
        required: true
        type: string
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write
  packages: write  # 【新增】允许 GitHub Actions 向 GHCR 推送 Docker 镜像

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: rax3000m/immortalwrt-chasey/rax3000m-imoutowrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: rax3000m/immortalwrt-chasey/diy-part2-rax3000m.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-docker-images: 'true'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set lower case owner name for Docker
      run: |
        # Docker 镜像名称必须全小写
        echo "IMAGE_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Initialize Docker Build Environment
      run: |
        # 1. 启动官方 OpenWrt 编译环境容器作为后台守护进程
        docker run -dit --name builder ghcr.io/p3terx/openwrt-build-env:ubuntu-22.04 bash
        
        # 2. 将 GitHub 仓库拉取到的所有脚本（包含 config 和 diy.sh）拷入容器
        docker cp . builder:/builder_workspace
        
        # 3. 修复权限（p3terx 镜像默认使用 user 账户编译）
        docker exec -u root builder chown -R user:user /builder_workspace

    - name: Clone source code (In Docker)
      run: |
        docker exec -u user builder bash -c '
          cd /builder_workspace
          git clone --depth 1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          [ -e ${{ env.FEEDS_CONF }} ] && mv ${{ env.FEEDS_CONF }} openwrt/feeds.conf.default
          chmod +x ${{ env.DIY_P1_SH }}
          cd openwrt
          ../${{ env.DIY_P1_SH }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        '

    - name: Download package (In Docker)
      run: |
        docker exec -u user builder bash -c '
          cd /builder_workspace
          [ -e files ] && mv files openwrt/files
          [ -e ${{ env.CONFIG_FILE }} ] && mv ${{ env.CONFIG_FILE }} openwrt/.config
          chmod +x ${{ env.DIY_P2_SH }}
          cd openwrt
          ../${{ env.DIY_P2_SH }}
          make defconfig
          for i in {1..3}; do make download -j8 && break || sleep 5; done
          find dl -size -1024c -exec rm -f {} \;
        '

    - name: Compile the firmware (In Docker)
      id: compile
      run: |
        docker exec -u user builder bash -c '
          cd /builder_workspace/openwrt
          make -j$(nproc) || make -j1 V=s
        '
        echo "status=success" >> ${GITHUB_OUTPUT}
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Extract Firmware from Docker
      if: steps.compile.outputs.status == 'success'
      run: |
        # 将容器内编译好的 bin 文件夹提取到外部，供后续 Release 下载使用
        docker cp builder:/builder_workspace/openwrt/bin ./bin
        
        cd ./bin/targets/*/*
        rm -rf packages config.buildinfo feeds.buildinfo sha256sums version.buildinfo
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M-immortalwrt-6.12-cmcc_rax3000m")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "基于 Docker 环境编译成功" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Clean up Container before Commit (CRITICAL)
      run: |
        # 极其重要：清理临时编译缓存，保留 dl 依赖包。
        # 否则容器将高达 20GB 以上，导致推送失败或空间超限。
        docker exec -u user builder bash -c '
          cd /builder_workspace/openwrt
          make clean
        '

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Commit and Push Docker Image to GHCR
      run: |
        IMAGE_NAME="ghcr.io/${{ env.IMAGE_OWNER }}/rax3000m-build-env"
        
        echo "==> 1. 将编译成功的容器打包为镜像..."
        docker commit builder $IMAGE_NAME:latest
        
        echo "==> 2. 推送至 GHCR..."
        docker push $IMAGE_NAME:latest