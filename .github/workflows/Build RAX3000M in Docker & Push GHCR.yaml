name: Build RAX3000M ImmortalWrt (Docker & GHCR)

on:
  workflow_call:
    inputs:
      upstream_tag:
        description: 'The new upstream tag that triggered this run'
        required: true
        type: string

  repository_dispatch:

  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write   # 授予删除工作流运行记录等权限
  packages: write  # 授权推送 Docker 镜像至 GitHub Container Registry (GHCR)

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: rax3000m/immortalwrt-chasey/rax3000m-imoutowrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: rax3000m/immortalwrt-chasey/diy-part2-rax3000m.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FILE_NAME: CMCC-rax3000m-ImmortalWrt
  PRODUCT_NAME: CMCC-rax3000m-ImmortalWrt

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 1024
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-docker-images: 'true'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set lower case owner name for Docker
      run: |
        # GHCR 规范要求镜像路径名称必须为全小写字母
        echo "IMAGE_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Initialize Docker Build Environment
      run: |
        # 1. 采用 Docker Hub 公开镜像 p3terx/build-env:ubuntu-22.04（免登录直接拉取，避免 403 / denied 错误）
        docker run -dit --name builder p3terx/build-env:ubuntu-22.04 bash
        
        # 2. 将源码库中的配置文件与 DIY 脚本拷贝进容器
        docker cp . builder:/builder_workspace
        
        # 3. 修复容器内 workspace 的所有权，切换为普通用户 user 进行编译
        docker exec -u root builder chown -R user:user /builder_workspace

    - name: Check server performance
      run: |
        echo -e "---------------------------CPU信息------------------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "-------------------------------内存信息-------------------------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo "-----------------------------硬盘信息---------------------------------------------"
        df -Th

    - name: Clone source code & Feeds (In Docker)
      run: |
        docker exec -u user builder bash -c '
          cd /builder_workspace
          git clone --depth 1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          [ -e ${{ env.FEEDS_CONF }} ] && mv ${{ env.FEEDS_CONF }} openwrt/feeds.conf.default
          chmod +x ${{ env.DIY_P1_SH }}
          cd openwrt
          ../${{ env.DIY_P1_SH }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
        '

    - name: Download package (In Docker)
      id: package
      run: |
        docker exec -u user builder bash -c '
          cd /builder_workspace
          [ -e files ] && mv files openwrt/files
          [ -e ${{ env.CONFIG_FILE }} ] && mv ${{ env.CONFIG_FILE }} openwrt/.config
          chmod +x ${{ env.DIY_P2_SH }}
          cd openwrt
          ../${{ env.DIY_P2_SH }}
          make defconfig
          for i in {1..3}; do make download -j8 && break || sleep 5; done
          find dl -size -1024c -exec rm -f {} \;
        '

    - name: Compile the firmware (In Docker)
      id: compile
      run: |
        docker exec -u user builder bash -c '
          cd /builder_workspace/openwrt
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
        '
        echo "status=success" >> ${GITHUB_OUTPUT}
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Extract Firmware from Docker
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        # 将容器内编译好的 bin 结果目录拷出到 Runner
        docker cp builder:/builder_workspace/openwrt/bin ./bin
        
        cd $GITHUB_WORKSPACE
        tar -zcvf AllPackages.tar.gz bin/packages || true
        cp AllPackages.tar.gz bin/targets/*/* || true
        cd bin/targets/*/*
        rm -rf packages config.buildinfo feeds.buildinfo sha256sums version.buildinfo
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M-immortalwrt-6.12-cmcc_rax3000m")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "cmcc_rax3000m-6.12固件 (Docker 容器构建)" >> release.txt
        echo "后台：192.168.2.1" >> release.txt
        echo "账号：root" >> release.txt
        echo "密码：无" >> release.txt
        echo "默认主题：Argon" >> release.txt
        echo "集成插件：nikki wol samba4 upnp hd_idle argon_config docker hysteria tailscale" >> release.txt
        echo "编译源码：[点此处查看](https://github.com/chasey-dev/immortalwrt-mt798x-rebase)" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Clean up Container before Commit
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        # 极重要：清理几 GB 的临时编译垃圾文件，保留源码配置和 dl 依赖包
        # 防止打包成的 Docker 镜像超大（可从 20GB 压缩降至 3~4GB 左右）
        docker exec -u user builder bash -c '
          cd /builder_workspace/openwrt
          make clean
        '

    - name: Login to GitHub Container Registry
      if: steps.compile.outputs.status == 'success' && !cancelled()
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Commit and Push Docker Image to GHCR
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        IMAGE_NAME="ghcr.io/${{ env.IMAGE_OWNER }}/rax3000m-build-env"
        
        echo "==> 1. 将包含已下载依赖和环境的容器打包提交为镜像..."
        docker commit builder $IMAGE_NAME:latest
        
        echo "==> 2. 推送容器镜像至 GitHub Packages (GHCR)..."
        docker push $IMAGE_NAME:latest

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      if: always()
      with:
        retain_days: 1
        keep_minimum_runs: 3