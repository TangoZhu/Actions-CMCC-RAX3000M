name: Build RAX3000M ImmortalWrt in Docker (With Caches & DL)

on:
  workflow_call:
    inputs:
      upstream_tag:
        description: 'The new upstream tag that triggered this run'
        required: true
        type: string
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: rax3000m/immortalwrt-chasey/rax3000m-imoutowrt.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: rax3000m/immortalwrt-chasey/diy-part2-rax3000m.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_DOCKER_IMAGE: true    # 是否导出并上传离线 Docker 镜像
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FILE_NAME: CMCC-rax3000m-ImmortalWrt
  PRODUCT_NAME: CMCC-rax3000m-ImmortalWrt
  DOCKER_CONTAINER_NAME: openwrt_builder

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Start Docker Container
      run: |
        docker run -d \
          --name ${{ env.DOCKER_CONTAINER_NAME }} \
          -e TZ="${{ env.TZ }}" \
          -v $GITHUB_WORKSPACE:/workspace \
          -w /workspace \
          ubuntu:22.04 tail -f /dev/null

    - name: Prepare Docker Build Environment
      run: |
        docker exec ${{ env.DOCKER_CONTAINER_NAME }} bash -c "
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq ack antlr3 aria2 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip libpython3-dev qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev time gn sudo
          
          useradd -m -s /bin/bash builduser
          echo 'builduser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
          chown -R builduser:builduser /workspace
        "

    - name: Clone source code & Setup feeds
      run: |
        docker exec -u builduser ${{ env.DOCKER_CONTAINER_NAME }} bash -c "
          git clone --depth 1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          [ -e ${{ env.FEEDS_CONF }} ] && mv ${{ env.FEEDS_CONF }} openwrt/feeds.conf.default
          chmod +x ${{ env.DIY_P1_SH }}
          ./${{ env.DIY_P1_SH }}
          
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          cd /workspace
          [ -e files ] && mv files openwrt/files
          [ -e ${{ env.CONFIG_FILE }} ] && mv ${{ env.CONFIG_FILE }} openwrt/.config
          chmod +x ${{ env.DIY_P2_SH }}
          ./${{ env.DIY_P2_SH }}
        "

    - name: SSH into Actions
      uses: mxschmitt/action-tmate@v3
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')

    - name: Pre-download Packages & Compile
      id: compile
      run: |
        docker exec -u builduser ${{ env.DOCKER_CONTAINER_NAME }} bash -c "
          cd openwrt
          make defconfig
          # 提前完整下载所有源码包及依赖 (国内最容易被墙的部分)
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
          
          echo -e '\$(nproc) thread compile'
          make -j\$(nproc) || make -j1 || make -j1 V=s
        "
        echo "status=success" >> ${GITHUB_OUTPUT}
        
        DEVICE_NAME=$(grep '^CONFIG_TARGET.*DEVICE.*=y' openwrt/.config | sed -r 's/.*DEVICE_(.*)=y/\1/')
        [ -n "$DEVICE_NAME" ] && echo "DEVICE_NAME=_$DEVICE_NAME" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Clean up Temp Files (Keep dl, feeds & sources for Offline Build)
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        # 针对离线环境保留：dl 目录 (包源码)、feeds 目录 (拓展包)、.config
        # 仅删除体积极其庞大且可由本地重新生成的编译中间产物 (build_dir 和 staging_dir)
        docker exec -u builduser ${{ env.DOCKER_CONTAINER_NAME }} bash -c "
          cd /workspace/openwrt
          rm -rf build_dir staging_dir
        "
        # 清理 Linux apt 系统的临时安装包
        docker exec ${{ env.DOCKER_CONTAINER_NAME }} bash -c "apt-get clean && rm -rf /var/lib/apt/lists/*"

    - name: Export and Compress Offline Docker Image
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_DOCKER_IMAGE == 'true' && !cancelled()
      run: |
        mkdir -p $GITHUB_WORKSPACE/docker_export
        docker stop ${{ env.DOCKER_CONTAINER_NAME }}
        
        # 提交当前带源码和依赖的完整环境镜像
        docker commit ${{ env.DOCKER_CONTAINER_NAME }} openwrt-offline-builder:latest
        
        # 打包导出镜像文件
        IMAGE_NAME="openwrt-offline-env${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}.tar.gz"
        echo "正在导出离线 Docker 镜像 (含 dl 源码包与 feeds)..."
        docker save openwrt-offline-builder:latest | gzip > $GITHUB_WORKSPACE/docker_export/$IMAGE_NAME
        
        echo "DOCKER_IMAGE_PATH=$GITHUB_WORKSPACE/docker_export/$IMAGE_NAME" >> $GITHUB_ENV

    - name: Organize Firmware files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd $GITHUB_WORKSPACE
        cd openwrt/bin/targets/*/*
        rm -rf packages config.buildinfo feeds.buildinfo sha256sums version.buildinfo
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: Upload Offline Docker Image to Release
      uses: softprops/action-gh-release@v2
      if: steps.compile.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: $(date +"%Y.%m.%d-%H%M-immortalwrt-6.12-offline-env")
        body: |
          ### 离线编译 Docker 镜像说明
          - **内含资源**：全套编译依赖工具链、完整 `dl` 依赖包、`feeds` 拓展包及已配置好的 `.config` 文件。
          - **国内使用**：导入此镜像后无需再连接外网下载依赖，直接执行 `make` 即可二次编译！
        files: |
          ${{ env.FIRMWARE }}/*
          ${{ env.DOCKER_IMAGE_PATH }}